name: OpenTofu CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write
  pull-requests: read

env:
  TOFU_VERSION: "1.11.6"
  TERRAMATE_VERSION: "0.17.0"
  TRIVY_VERSION: "v0.70.0"
  TRIVY_INSTALL_COMMIT: "8a3177aedf7ee0864920eb1852eef031cd3742b8"  # v0.70.0 release commit
  GCP_PROJECT_ID: "research-lab-495809"
  GCP_WIF_PROVIDER: "projects/1074394836652/locations/global/workloadIdentityPools/github-actions/providers/github"
  GCP_SERVICE_ACCOUNT: "github-actions-tofu@research-lab-495809.iam.gserviceaccount.com"
  GCP_SERVICE_ACCOUNT_PLAN: "github-actions-tofu-plan@research-lab-495809.iam.gserviceaccount.com"

jobs:
  detect-foundational-changes:
    name: Detect foundational stack changes
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          fetch-depth: 0
      - uses: terramate-io/terramate-action@1cc78a548efefaab7762f4d06f51aa6de06ce201  # v3.3.0
        with:
          version: ${{ env.TERRAMATE_VERSION }}
      - name: Warn if foundational stacks changed
        env:
          PUSH_CHANGE_BASE: ${{ github.event.before }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            changed=$(terramate list --changed --git-change-base="$PUSH_CHANGE_BASE" --tags foundational)
          else
            changed=$(terramate list --changed --tags foundational)
          fi
          if [ -n "$changed" ]; then
            echo "::warning title=foundational stack changed::Foundational stack（bootstrap / WIF 等）變更需由本機 ADC 手動 apply，CI 不會自動處理。Stacks: $changed"
          else
            echo "No foundational stack changes detected."
          fi

  generate-check:
    name: Terramate generate check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
      - uses: terramate-io/terramate-action@1cc78a548efefaab7762f4d06f51aa6de06ce201  # v3.3.0
        with:
          version: ${{ env.TERRAMATE_VERSION }}
      - name: terramate generate
        run: terramate generate
      - name: Ensure generated files are committed
        run: git diff --exit-code

  plan:
    name: Plan changed stacks (PR)
    if: github.event_name == 'pull_request'
    needs: [generate-check]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          fetch-depth: 0
      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093  # v3.0.0
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT_PLAN }}
      - uses: terramate-io/terramate-action@1cc78a548efefaab7762f4d06f51aa6de06ce201  # v3.3.0
        with:
          version: ${{ env.TERRAMATE_VERSION }}
      - uses: opentofu/setup-opentofu@847eaa4afeb791b06daa46e8eafa8b1b68d7cfb4  # v2.0.1
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          tofu_wrapper: false
      - name: List changed stacks (excluding foundational)
        run: terramate list --changed --no-tags foundational
      - name: tofu fmt -check
        run: terramate run --changed --no-tags foundational -- tofu fmt -check
      - name: tofu init
        run: terramate run --changed --no-tags foundational -- tofu init -input=false
      - name: tofu validate
        run: terramate run --changed --no-tags foundational -- tofu validate
      - name: tofu plan (capture output)
        id: plan
        run: |
          set -o pipefail
          {
            echo "## Tofu Plan Results"
            echo ""
            changed=$(terramate list --changed --no-tags foundational)
            if [ -z "$changed" ]; then
              echo "_No stacks changed in this PR._"
              exit 0
            fi
            echo "Changed stacks:"
            echo '```'
            echo "$changed"
            echo '```'
            echo ""
            terramate run --changed --no-tags foundational --continue-on-error -- \
              sh -c 'printf "\n### Stack: %s\n\`\`\`hcl\n" "$(realpath --relative-to="$GITHUB_WORKSPACE" .)" && tofu plan -no-color -input=false -lock=false; printf "\n\`\`\`\n"'
          } > ${{ runner.temp }}/plan-output.md
          if [ "$(wc -c < ${{ runner.temp }}/plan-output.md)" -gt 60000 ]; then
            head -c 60000 ${{ runner.temp }}/plan-output.md > ${{ runner.temp }}/plan-output.trunc.md
            {
              echo ""
              echo "---"
              echo "_Output truncated. See full log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}_"
            } >> ${{ runner.temp }}/plan-output.trunc.md
            mv ${{ runner.temp }}/plan-output.trunc.md ${{ runner.temp }}/plan-output.md
          fi
      - name: Post plan to PR
        if: always()
        uses: marocchino/sticky-pull-request-comment@0ea0beb66eb9baf113663a64ec522f60e49231c0  # v3.0.4
        with:
          header: tofu-plan
          path: ${{ runner.temp }}/plan-output.md

  security-scan-pr:
    name: Trivy IaC scan (changed stacks)
    if: github.event_name == 'pull_request'
    needs: [generate-check]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
      pull-requests: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          fetch-depth: 0

      - uses: terramate-io/terramate-action@1cc78a548efefaab7762f4d06f51aa6de06ce201  # v3.3.0
        with:
          version: ${{ env.TERRAMATE_VERSION }}

      - name: terramate generate
        run: terramate generate

      - name: List changed stacks
        id: changed
        run: |
          stacks=$(terramate list --changed --no-tags foundational)
          if [ -z "$stacks" ]; then
            echo "No stack changes — skipping scan."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "stacks<<EOF" >> "$GITHUB_OUTPUT"
            echo "$stacks" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Trivy
        if: steps.changed.outputs.has_changes == 'true'
        run: |
          curl -sfL "https://raw.githubusercontent.com/aquasecurity/trivy/${TRIVY_INSTALL_COMMIT}/contrib/install.sh" \
            | sh -s -- -b /usr/local/bin "${TRIVY_VERSION}"
          trivy --version

      - name: Trivy IaC scan changed stacks (HIGH/CRITICAL → fail)
        if: steps.changed.outputs.has_changes == 'true'
        env:
          STACKS: ${{ steps.changed.outputs.stacks }}
        run: |
          fail=0
          while IFS= read -r stack; do
            [ -z "$stack" ] && continue
            echo "::group::Trivy scan: $stack (HIGH/CRITICAL)"
            sarif_name="trivy-$(echo "$stack" | tr / - | sed 's/^-//').sarif"
            if ! trivy config "$stack" \
                --severity HIGH,CRITICAL \
                --exit-code 1 \
                --ignorefile .trivyignore \
                --format sarif \
                --output "$sarif_name"; then
              fail=1
            fi
            echo "::endgroup::"
          done <<< "$STACKS"

          # MEDIUM/LOW annotate-only（table 印 log，不 fail）
          while IFS= read -r stack; do
            [ -z "$stack" ] && continue
            echo "::group::Trivy scan: $stack (MEDIUM/LOW, annotate only)"
            trivy config "$stack" \
              --severity MEDIUM,LOW \
              --exit-code 0 \
              --ignorefile .trivyignore \
              --format table || true
            echo "::endgroup::"
          done <<< "$STACKS"

          exit $fail

      - name: Merge SARIF files
        if: always() && steps.changed.outputs.has_changes == 'true'
        run: |
          shopt -s nullglob
          files=(trivy-*.sarif)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No SARIF files to merge."
            exit 0
          fi
          # CodeQL Action 2025-07 起拒收同 category 多 run 的 SARIF：
          # https://github.blog/changelog/2025-07-21-code-scanning-will-stop-combining-multiple-sarif-runs-uploaded-in-the-same-sarif-file/
          # 把多檔 SARIF flatten 成單一 run：合併所有 results、依 ruleId 去重 rules。
          jq -s '
            . as $docs
            | {
                "$schema": $docs[0]."$schema",
                version: $docs[0].version,
                runs: [{
                  tool: {
                    driver: (
                      $docs[0].runs[0].tool.driver
                      | .rules = ([$docs[].runs[].tool.driver.rules[]?] | unique_by(.id))
                    )
                  },
                  results: [$docs[].runs[].results[]?]
                }]
              }
          ' "${files[@]}" > merged.sarif
          echo "Merged ${#files[@]} SARIF file(s) into merged.sarif (single run)"

      - name: Upload SARIF to GitHub Code Scanning
        if: always() && steps.changed.outputs.has_changes == 'true' && hashFiles('merged.sarif') != ''
        uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e  # v4.36.2
        with:
          sarif_file: merged.sarif
          category: trivy-iac-pr

  apply:
    name: Apply changed stacks (main)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [generate-check]
    runs-on: ubuntu-24.04
    environment: production
    env:
      PUSH_CHANGE_BASE: ${{ github.event.before }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          fetch-depth: 0
      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093  # v3.0.0
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
      - uses: terramate-io/terramate-action@1cc78a548efefaab7762f4d06f51aa6de06ce201  # v3.3.0
        with:
          version: ${{ env.TERRAMATE_VERSION }}
      - uses: opentofu/setup-opentofu@847eaa4afeb791b06daa46e8eafa8b1b68d7cfb4  # v2.0.1
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          tofu_wrapper: false
      - name: List changed stacks (excluding foundational)
        run: terramate list --changed --git-change-base="$PUSH_CHANGE_BASE" --no-tags foundational
      - name: tofu init
        run: terramate run --changed --git-change-base="$PUSH_CHANGE_BASE" --no-tags foundational -- tofu init -input=false
      - name: tofu apply
        run: terramate run --changed --git-change-base="$PUSH_CHANGE_BASE" --no-tags foundational -- tofu apply -input=false -auto-approve -lock-timeout=5m
