name: OpenTofu CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write
  pull-requests: read

env:
  TOFU_VERSION: "1.11.6"
  TERRAMATE_VERSION: "0.17.0"
  GCP_PROJECT_ID: "research-lab-495809"
  GCP_WIF_PROVIDER: "projects/1074394836652/locations/global/workloadIdentityPools/github-actions/providers/github"
  GCP_SERVICE_ACCOUNT: "github-actions-tofu@research-lab-495809.iam.gserviceaccount.com"
  GCP_SERVICE_ACCOUNT_PLAN: "github-actions-tofu-plan@research-lab-495809.iam.gserviceaccount.com"

jobs:
  detect-foundational-changes:
    name: Detect foundational stack changes
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: terramate-io/terramate-action@v3
        with:
          version: ${{ env.TERRAMATE_VERSION }}
      - name: Warn if foundational stacks changed
        env:
          PUSH_CHANGE_BASE: ${{ github.event.before }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            changed=$(terramate list --changed --git-change-base="$PUSH_CHANGE_BASE" --tags foundational)
          else
            changed=$(terramate list --changed --tags foundational)
          fi
          if [ -n "$changed" ]; then
            echo "::warning title=foundational stack changed::Foundational stack（bootstrap / WIF 等）變更需由本機 ADC 手動 apply，CI 不會自動處理。Stacks: $changed"
          else
            echo "No foundational stack changes detected."
          fi

  generate-check:
    name: Terramate generate check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: terramate-io/terramate-action@v3
        with:
          version: ${{ env.TERRAMATE_VERSION }}
      - name: terramate generate
        run: terramate generate
      - name: Ensure generated files are committed
        run: git diff --exit-code

  plan:
    name: Plan changed stacks (PR)
    if: github.event_name == 'pull_request'
    needs: [generate-check]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT_PLAN }}
      - uses: terramate-io/terramate-action@v3
        with:
          version: ${{ env.TERRAMATE_VERSION }}
      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          tofu_wrapper: false
      - name: List changed stacks (excluding foundational)
        run: terramate list --changed --no-tags foundational
      - name: tofu fmt -check
        run: terramate run --changed --no-tags foundational -- tofu fmt -check
      - name: tofu init
        run: terramate run --changed --no-tags foundational -- tofu init -input=false
      - name: tofu validate
        run: terramate run --changed --no-tags foundational -- tofu validate
      - name: tofu plan (capture output)
        id: plan
        run: |
          set -o pipefail
          {
            echo "## Tofu Plan Results"
            echo ""
            changed=$(terramate list --changed --no-tags foundational)
            if [ -z "$changed" ]; then
              echo "_No stacks changed in this PR._"
              exit 0
            fi
            echo "Changed stacks:"
            echo '```'
            echo "$changed"
            echo '```'
            echo ""
            terramate run --changed --no-tags foundational --continue-on-error -- \
              sh -c 'printf "\n### Stack: %s\n\`\`\`hcl\n" "$(realpath --relative-to="$GITHUB_WORKSPACE" .)" && tofu plan -no-color -input=false -lock=false; printf "\n\`\`\`\n"'
          } > ${{ runner.temp }}/plan-output.md
          if [ "$(wc -c < ${{ runner.temp }}/plan-output.md)" -gt 60000 ]; then
            head -c 60000 ${{ runner.temp }}/plan-output.md > ${{ runner.temp }}/plan-output.trunc.md
            {
              echo ""
              echo "---"
              echo "_Output truncated. See full log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}_"
            } >> ${{ runner.temp }}/plan-output.trunc.md
            mv ${{ runner.temp }}/plan-output.trunc.md ${{ runner.temp }}/plan-output.md
          fi
      - name: Post plan to PR
        if: always()
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: tofu-plan
          path: ${{ runner.temp }}/plan-output.md

  apply:
    name: Apply changed stacks (main)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [generate-check]
    runs-on: ubuntu-24.04
    environment: production
    env:
      PUSH_CHANGE_BASE: ${{ github.event.before }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
      - uses: terramate-io/terramate-action@v3
        with:
          version: ${{ env.TERRAMATE_VERSION }}
      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          tofu_wrapper: false
      - name: List changed stacks (excluding foundational)
        run: terramate list --changed --git-change-base="$PUSH_CHANGE_BASE" --no-tags foundational
      - name: tofu init
        run: terramate run --changed --git-change-base="$PUSH_CHANGE_BASE" --no-tags foundational -- tofu init -input=false
      - name: tofu apply
        run: terramate run --changed --git-change-base="$PUSH_CHANGE_BASE" --no-tags foundational -- tofu apply -input=false -auto-approve -lock-timeout=5m
